# Browser access: "/" -> Log output, "/pingpong" -> Ping pong.
# /pings is intentionally NOT exposed; only Log output calls it, inside the cluster.
#
# Requires an Ingress controller. Set ingressClassName to the one you installed
# (check with: kubectl get ingressclass).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: log-output-ping-pong-ingress
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /pingpong
            pathType: Exact
            backend:
              service:
                name: ping-pong-svc
                port:
                  number: 2345
          - path: /
            pathType: Exact
            backend:
              service:
                name: log-output-svc
                port:
                  number: 2345
