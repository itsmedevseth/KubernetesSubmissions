apiVersion: apps/v1
kind: Deployment
metadata:
  name: ping-pong
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ping-pong
  template:
    metadata:
      labels:
        app: ping-pong
    spec:
      volumes:
        - name: shared-data
          persistentVolumeClaim:
            claimName: shared-claim
      containers:
        - name: ping-pong
          image: ping-pong:v2
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "3000"
            - name: PINGPONG_FILE
              value: /usr/src/app/shared/pingpong.txt
          volumeMounts:
            - name: shared-data
              mountPath: /usr/src/app/shared
