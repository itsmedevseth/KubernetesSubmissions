apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: project
  name: todo-app-dep
  labels:
    app: todo-app
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: todo-app
  template:
    metadata:
      labels:
        app: todo-app
    spec:
      volumes:
        - name: image-volume
          persistentVolumeClaim:
            claimName: image-claim
      initContainers:
        - name: fix-permissions
          image: busybox:1.36
          command: ["sh", "-c", "chown -R 1000:1000 /usr/src/app/files"]
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: image-volume
              mountPath: /usr/src/app/files
      containers:
        - name: todo-app
          image: todo-app:2.0
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: IMAGE_DIR
              value: /usr/src/app/files
            - name: IMAGE_CACHE_MINUTES
              value: "10"
          volumeMounts:
            - name: image-volume
              mountPath: /usr/src/app/files
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 192Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  namespace: project
  name: todo-app-svc
  labels:
    app: todo-app
spec:
  type: ClusterIP
  selector:
    app: todo-app
  ports:
    - name: http
      port: 2345
      targetPort: http
      protocol: TCP
